# ============================================================
# AI-Powered Agriculture Assistant - Application Properties
# ============================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=agri-assistant

# ============================================================
# MariaDB Database Configuration
# ============================================================
spring.datasource.url=jdbc:mariadb://localhost:3307/agri_assistant_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# AI Provider Configuration (Google Gemini)
# ============================================================
ai.provider.type=GEMINI
ai.provider.api.key=AIzaSyBmMJ9gHPdmSG7-0Pkq7Ox-4gpBkrOBw38
ai.provider.api.base.url=https://generativelanguage.googleapis.com/v1beta/models
ai.provider.model=gemini-2.5-flash-lite

# ============================================================
# File Upload Configuration
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ============================================================
# Cache Configuration (Caffeine)
# ============================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

# ============================================================
# Logging
# ============================================================
logging.level.com.agri.assistant=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
